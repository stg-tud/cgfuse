defaults:
  - base
  - preprocessor: java
  - _self_

# path to class
type:
  _target_: cgfuse.utils.datasets.CodeSearchNetDataset
source: "google/code_x_glue_ct_code_to_text"  # "google/code_x_glue_tc_text_to_code"

pl_feed: "input"
pl_language: "java"

cache_enforce: True

metric: ["em", "bleu"]
num_workers: 16
# PL feed is in input, we do not need edge mask implementation here

name: "codesearchnet"