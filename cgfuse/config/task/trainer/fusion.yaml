defaults:
  - base
  - _self_
  - optimizer: unixcoder
  - scheduler: unixcoder
  - optimizer@fusion.optimizer: gnn
  - scheduler@fusion.scheduler: gnn

automatic_optimization: False
epoch: 30
es_patience: 5

generation:
  # Beam size in generation
  beam_size: 10

fusion:
  # Should teacher should be used at all
  teacher: True
  # Teacher train epoch count
  adapting_epoch: 1
  # Fusion train epoch count
  epoch: 29
  # Scaling of the feature embeddings, default: 1.0
  # Higher values had lower effect. Testing with learned!
  scale: 1.0
  # Which layers should teacher be added
  # Which layers the GNN is attached to; the paper attaches it to the last layer only
  target_layers: [23]
  # Which embeddings should teacher be using, could be: ["self", "model", "layer"]
  # "self": Uses its own embedding space
  # "model": Uses attached models embedding space
  # "layer": Uses attached models features (layer-wise)
  emb_source: "layer"

  # Path to a pre-trained GNN expert checkpoint (output of task=bs_gnn_jv), required
  expert: null
