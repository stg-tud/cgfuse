# @package _global_
task_name: baseline
action_name: LM_initial
debug: False
is_test: True

# Target high-level task, should be among: ["seq2seq", "classification"] and other for bootstrap
language_task: "seq2seq"
# seed for torch, numpy and python.random
seed: 42

# path of the directory to output training logs
workdir: ".logs/${task_name}/${action_name}"

# name of the current experiment to log it in Aim.Run
experiment_name: "debug_all"

# dir to create .aim repo in
aim_repo: ".aim"

defaults:
  - trainer: baseline
  - dataset: concode
  - model: PLBART